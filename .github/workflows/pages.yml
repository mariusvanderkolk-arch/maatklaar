# Test, bouw en publiceer de app op GitHub Pages bij elke push naar main.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Tests
        run: npm test

      - uses: actions/configure-pages@v5

      - name: Bouwen
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # In de repo maatklaar-test (of elke repo die op -test eindigt) wordt automatisch de testversie gebouwd.
          VITE_TEST_MODE: ${{ endsWith(github.event.repository.name, '-test') }}
          # Betalen (Maatklaar Pro) staat uit tenzij de repo-variabele VITE_BILLING_ENABLED=true bestaat. Zie docs/BETALINGEN.md.
          VITE_BILLING_ENABLED: ${{ vars.VITE_BILLING_ENABLED || 'false' }}
          VITE_PRICES_INCL_VAT: ${{ vars.VITE_PRICES_INCL_VAT || 'false' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
